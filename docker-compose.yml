services:
  php:
    build: .
    container_name: php-concurrency
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    # init: true — добавляет tini как PID 1 в контейнере, который репает
    # осиротевших детей и форвардит сигналы (см. 01_fork/README.md). По
    # умолчанию выключено: уроки запускаются через `docker compose exec`
    # внутри уже работающей shell-сессии контейнера (PID 1 — sh), а не как
    # сам PID 1, так что этот сценарий здесь не критичен. Включи, если
    # запускаешь урок как ENTRYPOINT/CMD контейнера напрямую (`docker compose
    # run`) — особенно для демона 04_supervisor, где осиротевшие/зомби
    # процессы иначе может не подхватить никто.
#    init: true
